<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Navbar for Club-Events</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .navbar {
      background: linear-gradient(to right, #111827, #1f2937, #1e40af);
      transition: all 0.3s ease;
    }
    .nav-link {
      transition: color 0.3s ease;
    }
    .nav-link:hover {
      color: #e5e7eb;
    }
    .nav-link.active {
      color: #ffffff;
      font-weight: 700;
    }
    .navbar-toggler-icon {
      color: #ffffff;
    }
  </style>
</head>
<body class="font-['Roboto',sans-serif]">
  <nav class="navbar py-4 px-4">
  <div class="max-w-7xl mx-auto flex items-center justify-between w-full">
    <a href="index.html" class="text-2xl font-bold text-white pl-2">SVECW Clubs</a>
    <button class="md:hidden text-white focus:outline-none" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation" onclick="document.getElementById('navbarNav').classList.toggle('hidden')">
      <i class="fas fa-bars text-2xl navbar-toggler-icon"></i>
    </button>
    <div id="navbarNav" class="hidden md:flex md:items-center md:space-x-6">
      <ul class="flex flex-col md:flex-row md:space-x-6">
        <li class="nav-item">
          <a href="home.html" class="nav-link text-white text-base font-medium px-3 py-2">Home</a>
        </li>
        <li class="nav-item">
          <a id="eventsLink" href="#" class="nav-link text-white text-base font-medium px-3 py-2">Events</a>
        </li>
        <li class="nav-item">
          <a href="contactUs.html" class="nav-link text-white text-base font-medium px-3 py-2">Contact</a>
        </li>
        <li class="nav-item">
          <a href="profile.html" class="nav-link text-white text-base font-medium px-3 py-2">Profile</a>
        </li>
        <li class="nav-item">
          <a id="signOutLink" href="#" class="nav-link text-white text-base font-medium px-3 py-2">Sign out</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    const role = localStorage.getItem('role');
    if (!role) {
      window.location.href = 'index.html';
      return;
    }
    const navbarNav = document.getElementById('navbarNav');
    navbarNav.classList.add('hidden');
    const eventsLink = document.getElementById('eventsLink');
    if (role === 'CLUB_ADMIN' || role === 'CLUB_MEMBER') {
      eventsLink.href = 'events_admin.html';
    } else {
      eventsLink.href = 'events_student.html';
    }
    document.getElementById('signOutLink').addEventListener('click', (e) => {
      e.preventDefault();
      localStorage.removeItem('role');
      localStorage.removeItem('club');
      localStorage.removeItem('token');
      window.location.href = 'index.html';
    });
  });
</script>
</body>
</html>

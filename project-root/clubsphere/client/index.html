<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ClubSphere - Login & Signup</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.22.9/babel.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap');

    .container {
      transition: all 0.6s ease-in-out;
      display: flex;
      overflow: hidden;
    }

    .sign-in-container,
    .sign-up-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 50%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.6s ease-in-out;
    }
    .sign-in-container {
      z-index: 2;
      opacity: 1;
    }
    .sign-up-container {
      z-index: 1;
      opacity: 0;
    }
    .right-panel-active .sign-in-container {
      transform: translateX(100%);
      opacity: 0;
      z-index: 1;
    }

    .right-panel-active .sign-up-container {
      transform: translateX(100%);
      opacity: 1;
      z-index: 2;
    }

    .overlay-container {
      position: absolute;
      top: 0;
      left: 50%;
      width: 50%;
      height: 100%;
      overflow: hidden;
      transition: transform 0.6s ease-in-out;
      z-index: 3;
    }

    .right-panel-active .overlay-container {
      transform: translateX(-100%);
    }

    .overlay {
      position: relative;
      left: -100%;
      height: 100%;
      width: 200%;
      transform: translateX(0);
      transition: transform 0.6s ease-in-out;
      display: flex;
    }

    .right-panel-active .overlay {
      transform: translateX(50%);
    }

    .overlay-panel {
      position: absolute;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      top: 0;
      height: 100%;
      width: 50%;
    }

    .overlay-left {
      left: 0;
      transform: translateX(-20%);
    }

    .right-panel-active .overlay-left {
      transform: translateX(0);
    }

    .overlay-right {
      right: 0;
      transform: translateX(0);
    }

    .right-panel-active .overlay-right {
      transform: translateX(20%);
    }

    .custom-select-wrapper {
      position: relative;
      width: 100%;
    }

    .custom-select-wrapper select {
      appearance: none;
      -webkit-appearance: none;
      -moz-appearance: none;
      width: 100%;
      padding: 0.75rem 1rem 0.75rem 3rem;
      background: rgba(0, 0, 0, 0.5);
      color: white;
      border-radius: 9999px;
      border: none;
      outline: none;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      cursor: pointer;
    }

    .custom-select-wrapper::after {
      content: '\f078';
      font-family: 'Font Awesome 6 Free';
      font-weight: 900;
      position: absolute;
      right: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: rgba(255, 255, 255, 0.7);
      pointer-events: none;
    }

    .modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 50;
    }

    .modal-content {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      padding: 1.5rem;
      border-radius: 1rem;
      text-align: center;
      max-width: 300px;
      width: 90%;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
    }

    .modal-content p {
      color: #f87171;
      margin-bottom: 1rem;
    }

    .modal-content.success p {
      color: #4ade80;
    }

    .modal-content button {
      padding: 0.5rem 1rem;
      background: #1f2937;
      border: 2px solid white;
      color: white;
      border-radius: 9999px;
      font-weight: bold;
      cursor: pointer;
    }

    .modal-content button:hover {
      background: #374151;
    }

    .error-text {
      color: #f87171;
      font-size: 0.8rem;
      margin-top: 0.25rem;
      text-align: left;
    }

    @media (max-width: 640px) {
      .container {
        width: 100%;
        min-height: 600px;
      }

      .form-container {
        padding: 0 20px;
      }

      .overlay-container {
        display: none;
      }

      .sign-in-container,
      .sign-up-container {
        width: 100%;
      }

      .right-panel-active .sign-in-container {
        transform: translateX(0);
        opacity: 0;
      }

      .right-panel-active .sign-up-container {
        transform: translateX(0);
        opacity: 1;
      }
    }
  </style>
</head>
<body class="bg-gradient-to-br from-gray-900 via-gray-800 to-blue-900 min-h-screen font-['Roboto',sans-serif]">
  <div id="root" class="flex items-center justify-center min-h-screen"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const API_BASE_URL = 'http://localhost:3000';

    const AuthPage = () => {
      const [isSignUp, setIsSignUp] = useState(false);
      const [signInData, setSignInData] = useState({ username: '', password: '' });
      const [signUpData, setSignUpData] = useState({ username: '', password: '', role: '', club: '' });
      const [error, setError] = useState(null);
      const [success, setSuccess] = useState(null);
      const [clubs, setClubs] = useState([]);
      const [errors, setErrors] = useState({});

      // Fetch clubs on component mount
      useEffect(() => {
        const fetchClubs = async () => {
          try {
            const response = await fetch(`${API_BASE_URL}/api/clubs`);
            const data = await response.json();
            if (response.ok && data.status === 'success') {
              setClubs(data.data);
            } else {
              setError(data.message || 'Error fetching clubs');
            }
          } catch (err) {
            setError('Error fetching clubs: ' + err.message);
          }
        };
        fetchClubs();
      }, []);

      // Validate sign-in form
      const validateSignIn = () => {
        const newErrors = {};
        if (!signInData.username.trim()) newErrors.username = 'Username is required';
        if (!signInData.password) newErrors.password = 'Password is required';
        setErrors(newErrors);
        return Object.keys(newErrors).length === 0;
      };

      // Validate sign-up form
      const validateSignUp = () => {
        const newErrors = {};
        if (!signUpData.username.trim()) newErrors.username = 'Username is required';
        if (!signUpData.password) {
          newErrors.password = 'Password is required';
        } else if (signUpData.password.length < 6) {
          newErrors.password = 'Password must be at least 6 characters';
        }
        if (!signUpData.role) newErrors.role = 'Role is required';
        if ((signUpData.role === 'CLUB_MEMBER' || signUpData.role === 'CLUB_ADMIN') && !signUpData.club) {
          newErrors.club = 'Club is required for this role';
        }
        setErrors(newErrors);
        return Object.keys(newErrors).length === 0;
      };

      const handleSignInSubmit = async (e) => {
        e.preventDefault();
        if (!validateSignIn()) return;

        try {
          const response = await fetch(`${API_BASE_URL}/api/auth/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(signInData)
          });
          const data = await response.json();
          if (response.ok && data.status === 'success') {
            localStorage.setItem('token', data.token);
            localStorage.setItem('role', data.user.role);
            localStorage.setItem('club', data.user.club || '');
            localStorage.setItem('username', data.user.username);
            setError(null);
            // Redirect to home.html after sign-in
            window.location.href = 'home.html';
          } else {
            setError(data.message || 'Login failed');
          }
        } catch (err) {
          setError('Error connecting to server: ' + err.message);
        }
      };

      const handleSignUpSubmit = async (e) => {
        e.preventDefault();
        if (!validateSignUp()) return;

        try {
          const response = await fetch(`${API_BASE_URL}/api/auth/signup`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(signUpData)
          });
          const data = await response.json();
          if (response.ok && data.status === 'success') {
            setSuccess('Registration successful! Please sign in.');
            setIsSignUp(false);
            setSignUpData({ username: '', password: '', role: '', club: '' });
            setError(null);
            setErrors({});
          } else {
            setError(data.message || 'Registration failed');
          }
        } catch (err) {
          setError('Error connecting to server: ' + err.message);
        }
      };

      const closeModal = () => {
        setError(null);
        setSuccess(null);
      };

      return (
        <>
          <div className={`container bg-white/10 rounded-2xl shadow-2xl backdrop-blur-lg w-[850px] min-h-[500px] relative sm:flex ${isSignUp ? 'right-panel-active' : ''}`}>
            <div className="sign-in-container form-container">
              <form onSubmit={handleSignInSubmit} className="flex flex-col items-center w-full max-w-xs">
                <h1 className="text-3xl font-bold text-white mb-6">Sign In</h1>
                <div className="relative w-full mb-4">
                  <i className="fas fa-user absolute left-4 top-1/2 transform -translate-y-1/2 text-white/70"></i>
                  <input
                    type="text"
                    placeholder="Username"
                    value={signInData.username}
                    onChange={(e) => setSignInData({ ...signInData, username: e.target.value })}
                    className={`w-full p-3 pl-12 bg-black/50 text-white rounded-full shadow-md placeholder-white/70 ${errors.username ? 'border border-red-500' : ''}`}
                    required
                  />
                  {errors.username && <p className="error-text">{errors.username}</p>}
                </div>
                <div className="relative w-full mb-4">
                  <i className="fas fa-lock absolute left-4 top-1/2 transform -translate-y-1/2 text-white/70"></i>
                  <input
                    type="password"
                    placeholder="Password"
                    value={signInData.password}
                    onChange={(e) => setSignInData({ ...signInData, password: e.target.value })}
                    className={`w-full p-3 pl-12 bg-black/50 text-white rounded-full shadow-md placeholder-white/70 ${errors.password ? 'border border-red-500' : ''}`}
                    required
                  />
                  {errors.password && <p className="error-text">{errors.password}</p>}
                </div>
                <a href="#" className="text-sm text-gray-300 hover:text-white mb-4">Forgot password?</a>
                <button type="submit" className="mt-4 px-10 py-3 bg-black/50 border-2 border-white text-white rounded-full font-bold hover:bg-white/20 shadow-md">
                  Sign In
                </button>
              </form>
            </div>
            <div className="sign-up-container form-container">
              <form onSubmit={handleSignUpSubmit} className="flex flex-col items-center w-full max-w-xs">
                <h1 className="text-3xl font-bold text-white mb-6">Create Account</h1>
                <div className="relative w-full mb-4">
                  <i className="fas fa-user absolute left-4 top-1/2 transform -translate-y-1/2 text-white/70"></i>
                  <input
                    type="text"
                    placeholder="Username"
                    value={signUpData.username}
                    onChange={(e) => setSignUpData({ ...signUpData, username: e.target.value })}
                    className={`w-full p-3 pl-12 bg-black/50 text-white rounded-full shadow-md placeholder-white/70 ${errors.username ? 'border border-red-500' : ''}`}
                    required
                  />
                  {errors.username && <p className="error-text">{errors.username}</p>}
                </div>
                <div className="custom-select-wrapper mb-4">
                  <i className="fas fa-user-shield absolute left-4 top-1/2 transform -translate-y-1/2 text-white/70 z-10"></i>
                  <select
                    value={signUpData.role}
                    onChange={(e) => setSignUpData({ ...signUpData, role: e.target.value, club: '' })}
                    className={`relative ${errors.role ? 'border border-red-500' : ''}`}
                    required
                  >
                    <option value="" disabled>Select Role</option>
                    <option value="STUDENT">Student</option>
                    <option value="CLUB_MEMBER">Club Member</option>
                    <option value="CLUB_ADMIN">Club Admin</option>
                  </select>
                  {errors.role && <p className="error-text">{errors.role}</p>}
                </div>
                {(signUpData.role === 'CLUB_MEMBER' || signUpData.role === 'CLUB_ADMIN') && (
                  <div className="custom-select-wrapper mb-4">
                    <i className="fas fa-users absolute left-4 top-1/2 transform -translate-y-1/2 text-white/70 z-10"></i>
                    <select
                      value={signUpData.club}
                      onChange={(e) => setSignUpData({ ...signUpData, club: e.target.value })}
                      className={`relative ${errors.club ? 'border border-red-500' : ''}`}
                      required
                    >
                      <option value="" disabled>Select Club</option>
                      {clubs.map(club => (
                        <option key={club} value={club}>{club}</option>
                      ))}
                    </select>
                    {errors.club && <p className="error-text">{errors.club}</p>}
                  </div>
                )}
                <div className="relative w-full mb-4">
                  <i className="fas fa-lock absolute left-4 top-1/2 transform -translate-y-1/2 text-white/70"></i>
                  <input
                    type="password"
                    placeholder="Password"
                    value={signUpData.password}
                    onChange={(e) => setSignUpData({ ...signUpData, password: e.target.value })}
                    className={`w-full p-3 pl-12 bg-black/50 text-white rounded-full shadow-md placeholder-white/70 ${errors.password ? 'border border-red-500' : ''}`}
                    required
                  />
                  {errors.password && <p className="error-text">{errors.password}</p>}
                </div>
                <button type="submit" className="mt-4 px-10 py-3 bg-black/50 border-2 border-white text-white rounded-full font-bold hover:bg-white/20 shadow-md">
                  Sign Up
                </button>
              </form>
            </div>
            <div className="overlay-container">
              <div className="overlay bg-gradient-to-r from-gray-900 via-gray-800 to-blue-900">
                <div className="overlay-panel overlay-left">
                  <h1 className="text-3xl font-bold mb-4">Welcome Back!</h1>
                  <p className="mb-6 text-sm">Enter your credentials to access your club dashboard</p>
                  <button
                    onClick={() => setIsSignUp(false)}
                    className="px-10 py-3 bg-transparent border-2 border-white text-white rounded-full font-bold hover:bg-white/20 shadow-md"
                  >
                    Sign In
                  </button>
                </div>
                <div className="overlay-panel overlay-right">
                  <h1 className="text-3xl font-bold mb-4">Join the Club Community!</h1>
                  <p className="mb-6 text-sm">Create an account to engage with clubs and events</p>
                  <button
                    onClick={() => setIsSignUp(true)}
                    className="px-10 py-3 bg-transparent border-2 border-white text-white rounded-full font-bold hover:bg-white/20 shadow-md"
                  >
                    Sign Up
                  </button>
                </div>
              </div>
            </div>
          </div>
          {(error || success) && (
            <div className="modal">
              <div className={`modal-content ${success ? 'success' : ''}`}>
                <p>{error || success}</p>
                <button onClick={closeModal}>Close</button>
              </div>
            </div>
          )}
        </>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<AuthPage />);
  </script>
</body>
</html>
